# rules.yaml — the tunable rules the app reads. Changing behaviour later
# (bigger portfolio, different filters) means editing here, not the code.

# Where prices come from:
#   live   — real daily prices from Yahoo Finance (free, no key)
#   sample — the offline fake data used while building (and for tests)
data:
  price_source: live

portfolio:
  starting_cash: 10000        # pretend money the paper portfolio starts with (USD)
  # Buys are always WHOLE shares (CMC Invest sells whole shares only) —
  # that rule lives in the engine itself, it isn't configurable.
  max_position_value: 800     # max USD per pick — mirrors CMC's $1,200 AUD cap (~US$800)
  # Risk flags the paper portfolio and shortlist refuse to buy. These products
  # decay/swing in ways that would make the results misleading. Remove a flag
  # from this list to allow it again. (Decision from CLAUDE.md's Phase 2 reminder.)
  excluded_flags: [leveraged, inverse, volatility]
  shortlist_size: 5           # how many top picks make the shortlist
  stop_loss_pct: 10           # auto-sell a holding once it's down this % from entry

analysis:
  batch_size: 10              # tickers sent to the AI per request (fewer = slower + pricier)
  max_workers: 3              # AI requests running at the same time

# AI Pivot Scanner rules.
scanner:
  max_market_cap: 1000000000  # "small-cap": under ~$1B
  excluded_sectors: [Technology]  # non-tech companies only
  lookback_days: 30           # how recent a disclosure must be to count
  max_candidates: 8           # filings examined per scan (each costs 1 AI request)
