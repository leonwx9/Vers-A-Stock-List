# rules.yaml — the tunable rules the app reads. Changing behaviour later
# (bigger portfolio, different filters) means editing here, not the code.

# Where prices come from:
#   live   — real daily prices from Yahoo Finance (free, no key)
#   sample — the offline fake data used while building (and for tests)
data:
  price_source: live

portfolio:
  starting_cash: 10000        # pretend money the paper portfolio starts with (USD)
  # Buys are always WHOLE shares (CMC Invest sells whole shares only) —
  # that rule lives in the engine itself, it isn't configurable.
  max_position_value: 800     # max USD per pick — mirrors CMC's $1,200 AUD cap (~US$800)
  # Risk flags the paper portfolio and shortlist refuse to buy. These products
  # decay/swing in ways that would make the results misleading. Remove a flag
  # from this list to allow it again. (Decision from CLAUDE.md's Phase 2 reminder.)
  excluded_flags: [leveraged, inverse, volatility]
  shortlist_size: 5           # how many top picks make the shortlist
  # The AI chooses its own stop-loss % per stock (tailored to how volatile
  # that stock is). stop_loss_pct below is only the FALLBACK — used when
  # the AI's number is missing or outside [stop_loss_pct_min, _max].
  stop_loss_pct: 10
  stop_loss_pct_min: 5
  stop_loss_pct_max: 25

analysis:
  batch_size: 10              # tickers sent to the AI per request (fewer = slower + pricier)
  max_workers: 3              # AI requests running at the same time

# AI Pivot Scanner rules.
scanner:
  max_market_cap: 1000000000  # "small-cap": under ~$1B
  excluded_sectors: [Technology]  # non-tech companies only
  lookback_days: 30           # how recent a disclosure must be to count
  max_candidates: 8           # filings examined per scan (each costs 1 AI request)

# Event Strategy Lab rules — information only, never trades. See HANDOVER.md.
lab:
  max_queries: 8              # news searches per scan (one per strategy tag)
  headlines_per_query: 6      # headlines fetched per search
  max_headlines: 40           # cap on what one scan feeds the AI (cost control)
  brainstorm_count: 4         # new pattern suggestions per "Brainstorm" press

# Optional daily order-fill scheduler (off by default) — settles pending
# paper-trade orders even if Leon doesn't open the dashboard that day. No
# AI involved. Only runs while the Mac app itself is running — see HANDOVER.md.
scheduler:
  fill_hour_sydney: 8         # Sydney hour (24h) after which the daily run becomes due
  # Default times for the three optional overnight analysis runs, in US-
  # market time (ET) — DST-proof, because the market itself lives in ET.
  # 09:35 ≈ just after open, 12:30 ≈ mid-session, 15:30 ≈ just before close.
  # Leon can override these from the dashboard without touching this file;
  # only fires while his Claude account is the active AI provider — see
  # HANDOVER.md.
  analysis_times_et: ["09:35", "12:30", "15:30"]
