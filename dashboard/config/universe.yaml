# universe.yaml — THE asset universe. The rest of the app only knows what's
# listed here, so expanding to more stocks (or adding crypto later) means
# editing this file, not the code.
#
# Each entry:
#   symbol — the ticker
#   name   — human-readable name
#   type   — stock | etf   (a future "crypto" type slots in the same way)
#   flags  — optional risk labels: leveraged / inverse / volatility.
#            Flagged products are analysed but EXCLUDED from the shortlist and
#            paper portfolio (see rules.yaml) — they behave very differently
#            from normal shares.
#
# Source: STOCK_LIST.md (CMC Invest US single-share list, verified 2026-06-10).

